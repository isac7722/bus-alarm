name: BusWidget
options:
  bundleIdPrefix: com.pangjoong
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "26.0"
  generateEmptyDirectories: true

configs:
  Debug: debug
  Release: release

settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1"
    SUPPORTS_MACCATALYST: NO
    SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
    SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
    CURRENT_PROJECT_VERSION: "7"
    MARKETING_VERSION: "1.0.6"
    DEVELOPMENT_TEAM: K5M43RRH97
    CODE_SIGN_STYLE: Automatic

packages:
  NMapsMap:
    url: https://github.com/navermaps/SPM-NMapsMap
    exactVersion: 3.24.0

targets:
  BusWidgetApp:
    type: application
    platform: iOS
    sources:
      - path: BusWidgetApp
      - path: Shared
      - path: ../backend/app/content/privacy.json
        buildPhase: resources
    configFiles:
      Debug: Config/Debug.xcconfig
      Release: Config/Release.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pangjoong.BusWidget
        TARGETED_DEVICE_FAMILY: "1"
        PRODUCT_NAME: BusWidget
        PRODUCT_MODULE_NAME: BusWidgetApp
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleDisplayName: 버스 위젯
    info:
      path: BusWidgetApp/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDisplayName: 버스 위젯
        ITSAppUsesNonExemptEncryption: false
        NSSupportsLiveActivities: true
        NSLocationWhenInUseUsageDescription: 내 위치 주변의 버스 정류장을 지도에서 확인합니다. 정류장 조회를 위해 화면에 보이는 지도 범위를 서버로 전송합니다.
        CFBundleURLTypes:
          - CFBundleURLName: com.pangjoong.BusWidget.waiting
            CFBundleURLSchemes: [buswidget]
        UILaunchScreen: {}
        APIBaseURL: $(API_BASE_URL)
        NMFNcpKeyId: $(NAVER_MAP_CLIENT_ID)
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
    entitlements:
      path: BusWidgetApp/BusWidgetApp.entitlements
      properties:
        aps-environment: development
        com.apple.security.application-groups:
          - group.com.pangjoong.buswidget
    dependencies:
      - package: NMapsMap
      - target: BusWidgetExtension
        embed: true

  BusWidgetExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: BusWidgetExtension
      - path: Shared
    configFiles:
      Debug: Config/Debug.xcconfig
      Release: Config/Release.xcconfig
    settings:
      base:
        # Embedded extensions must use the containing app bundle ID as a prefix.
        PRODUCT_BUNDLE_IDENTIFIER: com.pangjoong.BusWidget.BusWidgetExtension
        TARGETED_DEVICE_FAMILY: "1"
        PRODUCT_NAME: BusWidgetExtension
        SKIP_INSTALL: true
    info:
      path: BusWidgetExtension/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDisplayName: 버스 도착
        APIBaseURL: $(API_BASE_URL)
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: BusWidgetExtension/BusWidgetExtension.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.pangjoong.buswidget

  BusWidgetTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: BusWidgetTests
    dependencies:
      - target: BusWidgetApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pangjoong.BusWidgetTests
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: true
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/BusWidget.app/BusWidget
        BUNDLE_LOADER: $(TEST_HOST)

  BusWidgetUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: BusWidgetUITests
    dependencies:
      - target: BusWidgetApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pangjoong.BusWidgetUITests
        GENERATE_INFOPLIST_FILE: true
        TEST_TARGET_NAME: BusWidgetApp

schemes:
  BusWidget:
    build:
      targets:
        BusWidgetApp: all
        BusWidgetExtension: all
        BusWidgetTests: [test]
    test:
      gatherCoverageData: true
      targets:
        - BusWidgetTests

  RouteMapUI:
    build:
      targets:
        BusWidgetApp: all
        BusWidgetUITests: [test]
    test:
      targets:
        - BusWidgetUITests

[project]
name = "bus-alarm-tools"
version = "0.1.0"
description = "Database maintenance scripts for BusWidget"
requires-python = ">=3.12"
dependencies = ["psycopg[binary]>=3.2,<4"]

[dependency-groups]
dev = ["ruff>=0.11,<1"]

[tool.uv]
package = false

[tool.ruff]
line-length = 120
target-version = "py312"
include = ["backend/scripts/**/*.py", "pyproject.toml"]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]
